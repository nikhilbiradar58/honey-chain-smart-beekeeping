<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Honey Chain Verification</title><link rel="stylesheet" href="/static/style.css?v=livefinal"></head><body><div class="public"><div class="public-card"><div class="eyebrow">HONEY CHAIN</div><h1>Product verification</h1><div id="r">Checking…</div></div></div><script>fetch('/api/verify/{{BATCH_ID}}').then(x=>x.json()).then(d=>{document.getElementById('r').innerHTML=d.verified?`<div class="pass">✓ VERIFIED GENUINE</div><p><b>${d.batch.id}</b></p><p>${d.batch.honey_type} · ${d.batch.cluster}</p><p>Harvest: ${d.batch.harvest_date}</p><p>Recorded purity score: ${d.batch.purity}/100</p><p class="muted">Ledger hash: ${d.ledger?.hash||'unavailable'}</p>`:`<div class="fail">✕ NOT VERIFIED</div><p>${d.reason}</p>`}).catch(()=>document.getElementById('r').textContent='Verification unavailable')}</script></body></html>
